<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<title>Bashir electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";setTimeout(function(){window.msgs.innerHTML="يرجى قطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="خطأ في تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت للمتصفح وأعد فتحه.";};

var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    window.msgs.innerHTML = "لم يتم العثور على المحتوى! - امسح بيانات المتصفح وأعد تثبيت الكاش...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        window.msgs.innerHTML = "مخصص فقط لأجهزة PS4 بالإصدارات من 9.00 إلى 14.00";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                window.msgs.innerHTML = 'إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () { doJb(); }, 500);
            };
            document.head.appendChild(script);
        } else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<hr>
<br>
<h1 id="msgs" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">بدء تثبيت ذاكرة التخزين المؤقت</h1>
<div class="footer">
    الإصدارات: <span style="color: #2ecc71;" dir="ltr">9.00 — 13.52</span>
    &nbsp;•&nbsp; <span style="color: #d6a84f;">14.00 قيد التحقق</span>
    &nbsp;•&nbsp; 
    GoldHEN <span style="color: #2ecc71;" dir="ltr">2.4b18.13</span>
</div>
<script>
(function () {
    var message = document.getElementById("msgs");
    if (!message) return;

    function updateMessageColor() {
        var text = (message.textContent || "").trim();
        message.classList.remove("msg-success", "msg-failure");
        message.style.color = "";

        if (/فشل|تعذر|خطأ|غير مدعوم|مخصصة فقط|FAILED|ERROR|UNSUPPORTED|TIMEOUT|MISMATCH|ABORTED|REBOOT|NOT-FOUND/i.test(text)) {
            message.classList.add("msg-failure");
        } else if (/بنجاح|بالفعل|تم تحميل|تم تثبيت|✔|✓|SUCCESS|\bPASS(?:ED)?\b|\bREADY\b/i.test(text)) {
            message.classList.add("msg-success");
        }
    }

    updateMessageColor();
    if (window.MutationObserver) {
        new MutationObserver(updateMessageColor).observe(message, {
            childList: true,
            characterData: true,
            subtree: true
        });
    }
})();
</script>
</body>
</html>
