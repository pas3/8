<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="slopkit.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Bashir Electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>تثبيت التخزين المؤقت</h1>
<hr>
<br>
<h1 id="msgs" class="msg-progress" aria-live="polite">بدء تثبيت ذاكرة التخزين المؤقت...</h1>
<script>
history.replaceState(null, null, "index.html");
var histlength = history.length;
history.go(-histlength);

window.setStatusMessage = function (message, status) {
    var el = document.getElementById("msgs");
    if (!el) {
        document.addEventListener("DOMContentLoaded", function () {
            window.setStatusMessage(message, status);
        }, false);
        return;
    }
    el.textContent = message;
    el.classList.remove("msg-success", "msg-failure", "msg-progress");
    if (status === "success" || status === "failure" || status === "progress") {
        el.classList.add("msg-" + status);
    }
};

function DLProgress(e) {
    var percent = e && e.total ? Math.min(100, Math.round((e.loaded / e.total) * 100)) : 0;
    var el = document.getElementById("msgs");
    if (!el) return;
    el.textContent = "جارٍ تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت: ";
    var percentNode = document.createElement("bdi");
    percentNode.setAttribute("dir", "ltr");
    percentNode.textContent = String(percent) + "%";
    el.appendChild(percentNode);
    el.classList.remove("msg-success", "msg-failure", "msg-progress");
    el.classList.add("msg-progress");
}

function showRestartInstructions() {
    setTimeout(function () {
        window.setStatusMessage("اكتمل فحص التخزين المؤقت. أغلق المتصفح ثم افتحه مجدداً.", "progress");
    }, 1500);
}

function DisplayCacheProgress() {
    window.setStatusMessage("تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔", "success");
    showRestartInstructions();
}

function DisplayCacheNoUpdate() {
    window.setStatusMessage("ذاكرة التخزين المؤقت مثبتة ومحدثة بالفعل ✔", "success");
    showRestartInstructions();
}

(function attachCacheEvents() {
    var appCache = window.applicationCache;
    if (!appCache || typeof appCache.addEventListener !== "function") {
        window.setStatusMessage("هذا المتصفح لا يتيح واجهة التخزين المؤقت المطلوبة. افتح الصفحة بمتصفح PS4 متوافق أو تحقق من دعم التخزين المؤقت.", "failure");
        return;
    }

    appCache.addEventListener("checking", function () {
        window.setStatusMessage("جارٍ التحقق من ملفات التخزين المؤقت...", "progress");
    }, false);
    appCache.addEventListener("downloading", function () {
        window.setStatusMessage("بدأ تنزيل ملفات التخزين المؤقت...", "progress");
    }, false);
    appCache.addEventListener("progress", DLProgress, false);
    appCache.addEventListener("cached", DisplayCacheProgress, false);
    appCache.addEventListener("updateready", DisplayCacheProgress, false);
    appCache.addEventListener("noupdate", DisplayCacheNoUpdate, false);
    appCache.addEventListener("obsolete", function () {
        window.setStatusMessage("ملف بيان التخزين المؤقت غير متاح أو أصبح قديماً. تحقق من رابط الصفحة والبيان.", "failure");
    }, false);
    appCache.addEventListener("error", function () {
        window.setStatusMessage("خطأ في تثبيت ذاكرة التخزين المؤقت. تحقق من اتصال الشبكة ومن وجود جميع الملفات المدرجة في البيان.", "failure");
    }, false);
})();
</script>
