<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Bashir Electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "تعذر تحميل الملفات المطلوبة. يُرجى مسح بيانات المتصفح وإعادة تحميل التخزين المؤقت.";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "هذه الصفحة مخصصة فقط لأجهزة PS4 التي تعمل بإصدارات النظام من 9.00 إلى 14.00";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span> (مخصص لإصدارات 9.00 إلى 14.00)';
            });
        }
    } else {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    }
}
    document.addEventListener("DOMContentLoaded", function () {
        var badge = document.getElementById("fw-badge");
        if (badge && isPS4) {
            badge.className = "fw-badge show";
            badge.innerHTML = 'إصدار النظام: <span dir="ltr">' + fwVersion + "</span>";
        }
    });
</script>
<div id="fw-badge" class="fw-badge" aria-live="polite"></div>
<hr>
<br>
<h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">جارٍ تحميل GoldHEN... يُرجى الانتظار</h1>
<div class="footer">
    الإصدارات: <span style="color: #2ecc71;" dir="ltr">9.00 — 13.52</span>
    &nbsp;•&nbsp; <span style="color: #d6a84f;">14.00 قيد التحقق</span>
    &nbsp;•&nbsp; 
    GoldHEN <span style="color: #2ecc71;" dir="ltr">2.4b18.13</span>
</div>
<script>
(function () {
    var message = document.getElementById("msgs");
    if (!message) return;

    function updateMessageColor() {
        var text = (message.textContent || "").trim();
        message.classList.remove("msg-success", "msg-failure");
        message.style.color = "";

        if (/فشل|تعذر|خطأ|غير مدعوم|مخصصة فقط|FAILED|ERROR|UNSUPPORTED|TIMEOUT|MISMATCH|ABORTED|REBOOT|NOT-FOUND/i.test(text)) {
            message.classList.add("msg-failure");
        } else if (/بنجاح|بالفعل|تم تحميل|تم تثبيت|✔|✓|SUCCESS|\bPASS(?:ED)?\b|\bREADY\b/i.test(text)) {
            message.classList.add("msg-success");
        }
    }

    updateMessageColor();
    if (window.MutationObserver) {
        new MutationObserver(updateMessageColor).observe(message, {
            childList: true,
            characterData: true,
            subtree: true
        });
    }
})();
</script>
</body>
</html>
